[project]
name = "lucia-api"
version = "0.2.2"
description = "API FastAPI de LUCIA: orquesta motores, sincroniza chess.com y expone analisis."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "lucia-core",
    "lucia-chesscom",
    "lucia-lichess",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",  # subida del archivo PGN (RF-1.5)
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "structlog>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lucia_api"]
