[project]
name = "lucia-core"
version = "0.4.3"
description = "Nucleo de LUCIA: puente UCI con motores, analisis de partidas, clasificacion de jugadas e insight."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "chess>=1.11",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lucia_core"]
