[project]
name = "lucia-chesscom"
version = "0.4.5"
description = "Cliente asincrono de la API publica de chess.com para LUCIA."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "httpx[http2]>=0.27",
    "chess>=1.11",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lucia_chesscom"]
